plugins {
    id 'com.android.application' version '9.3.1'
}

android {
    namespace 'com.android.inputmethod.latin'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'app.refract.keyboard'
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'java/proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs = ['java/res']
            assets.srcDirs = ['java/assets']
            java.srcDirs = ['common/src', 'java/src']
            manifest.srcFile 'java/AndroidManifest.xml'
        }
    }

    lint {
        checkReleaseBuilds = false
    }

    androidResources {
        noCompress += ['dict', 'litertlm']
    }

    externalNativeBuild {
        cmake {
            path file('native/jni/CMakeLists.txt')
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    google()
    mavenCentral()
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}

dependencies {
    implementation files('libs/litertlm-android-refract-0.14.0.aar')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation('com.google.android.gms:play-services-code-scanner:16.1.0') {
        exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
    }
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
